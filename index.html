<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2</title>
    <style>
        table {
            width: 400px;
            height: 200px;
            border-collapse: collapse; /* Об'єднує рамки в одну лінію */
        }
        td {
            border: 1px solid black;
        }
        /* Вирівнювання тексту за рядками, як на зразку */
        tr:nth-child(1) td {
            text-align: center; /* Перший рядок: по центру */
        }
        tr:nth-child(2) td {
            text-align: left; /* Другий рядок: по лівому краю */
            padding-left: 5px;
        }
        tr:nth-child(3) td {
            text-align: right; /* Третій рядок: по правому краю */
            padding-right: 5px;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>комірка 1</td>
            <td>комірка 2</td>
            <td>комірка 3</td>
        </tr>
        <tr>
            <td>комірка 4</td>
            <td>комірка 5</td>
            <td>комірка 6</td>
        </tr>
        <tr>
            <td>комірка 7</td>
            <td>комірка 8</td>
            <td>комірка 9</td>
        </tr>
    </table>

</body>
</html>
